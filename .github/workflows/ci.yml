name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, stated explicitly. The repository default is currently
# read-only, but relying on that means a change to the org/repo default silently
# widens what every job here can do with the workflow token.
permissions:
  contents: read

jobs:
  check:
    name: Lint · type-check · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # No job here performs authenticated git operations, so don't leave the
          # workflow token in .git/config for later steps (zizmor: artipacked).
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Retry: esbuild's postinstall can transiently fail with ETXTBSY ("text file
      # busy") on hosted runners when the just-written binary is validated.
      - run: npm ci || (sleep 5 && npm ci) || (sleep 15 && npm ci)
      - run: node scripts/make-icons.mjs
      - run: npm run check:version
      # One ESLint pass covers both packages (extension root + landing/src) —
      # see eslint.config.js. Warnings fail the build so they can't accumulate.
      - run: npm run lint
      - run: npm run typecheck
      # Coverage run instead of a plain `npm test`: it executes the same suite and
      # additionally writes coverage/lcov.info for the Codecov upload below.
      - run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: extension
          # Public repo, so uploads work without a token; the secret is used when
          # present because tokenless uploads are rate-limited and can flake.
          token: ${{ secrets.CODECOV_TOKEN }}
          # Codecov being unreachable must never fail the merge gate — the tests
          # themselves already passed by this point.
          fail_ci_if_error: false
      - run: npm run build
      - run: npm run build:firefox

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    # Extension e2e needs a headed browser via xvfb; keep it non-blocking so
    # environment quirks never gate a merge. The check job is the gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          # No job here performs authenticated git operations, so don't leave the
          # workflow token in .git/config for later steps (zizmor: artipacked).
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Retry: esbuild's postinstall can transiently fail with ETXTBSY ("text file
      # busy") on hosted runners when the just-written binary is validated.
      - run: npm ci || (sleep 5 && npm ci) || (sleep 15 && npm ci)
      - run: node scripts/make-icons.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run e2e

  landing:
    name: Landing site test · build (prerendered)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7
        with:
          # No job here performs authenticated git operations, so don't leave the
          # workflow token in .git/config for later steps (zizmor: artipacked).
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci || (sleep 5 && npm ci) || (sleep 15 && npm ci)
      - run: npm test
      # The build's prerender step launches Chromium (scripts/prerender.mjs) —
      # needs the browser binary + OS deps present, same as the extension's e2e job.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
