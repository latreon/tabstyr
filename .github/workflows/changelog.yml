name: Changelog sync

# Keeps the changelog in step with GitHub Releases without anyone running a
# script by hand. Publishing (or editing, or deleting) a release is the trigger;
# the daily run is a safety net for an event that was missed while Actions was
# unavailable, and workflow_dispatch is the manual button.
#
# There are TWO independent paths from a release to the live site, on purpose:
#
#   1. This workflow commits the refreshed data, so the repo — CHANGELOG.md and
#      landing/src/data/changelog.json — is always accurate on main.
#   2. The landing build itself re-fetches from the API (landing/package.json
#      runs scripts/fetch-changelog.mjs --soft), so ANY deploy publishes the
#      current releases even if this workflow never ran.
#
# Path 2 alone fixes the site; path 1 alone fixes the repo. Neither depends on
# the other, which is deliberate — this repo has already been through a spell
# where Actions could not run at all.
on:
  release:
    types: [published, edited, deleted, released]
  schedule:
    # 05:17 UTC — an odd minute, off the top-of-hour stampede on shared runners.
    - cron: '17 5 * * *'
  workflow_dispatch:

# Serialize: two releases published a minute apart would otherwise race on the
# same commit and one would lose its push.
concurrency:
  group: changelog-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Refresh from GitHub Releases
    runs-on: ubuntu-latest
    # Job-level, because a step's `if:` can read the env context but NOT secrets —
    # this is what makes the optional Netlify step skip cleanly when unconfigured.
    env:
      HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Always work from the default branch, not the tag a release event
          # points at — a tag checkout is detached and can't be pushed to.
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # No npm install: both scripts are dependency-free Node (fetch + fs).
      # GITHUB_TOKEN is only for the rate limit — the repo is public.
      - name: Fetch releases and regenerate CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-changelog.mjs
          node scripts/generate-changelog.mjs

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- CHANGELOG.md landing/src/data/changelog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already in sync — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md landing/src/data/changelog.json
          git commit -m "docs(changelog): sync from GitHub Releases" \
                     -m "Generated by .github/workflows/changelog.yml"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The site is on Netlify. If its git auto-deploy is off (or paused), a push
      # alone won't rebuild — so poke the build hook when one is configured.
      # Optional: with no secret set this step is skipped, not failed.
      - name: Trigger a Netlify rebuild
        if: steps.commit.outputs.changed == 'true' && env.HOOK != ''
        run: curl -fsS -X POST -d '{}' "$HOOK" > /dev/null && echo "Netlify build triggered."
